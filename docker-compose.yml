services:
  postgres:
    image: postgres:16-alpine
    container_name: pet_marketplace_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hayvonlar_bozori}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hayvonlar_bozori}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Brauzer orqali bazani boshqarish uchun yengil Web UI (http://localhost:8080)
  db_viewer:
    image: sosedoff/pgweb:latest
    container_name: pet_marketplace_ui
    restart: unless-stopped
    ports:
      - "8080:8081"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-hayvonlar_bozori}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
